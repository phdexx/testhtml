<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Материнская плата — тренажёр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-dot"></div>
      <span>МАТЕРИНСКАЯ ПЛАТА</span>
    </div>
    <div class="header-stats">
      <div class="hstat">Элементов: <span id="hs-total">41</span></div>
      <div class="hstat">Показано: <span id="hs-visible">40</span></div>
      <div class="hstat">Верно: <span id="hs-right" style="color:var(--green)">0</span></div>
    </div>
  </div>
</header>

<div class="mode-bar">
  <button class="mode-btn active" id="btn-learn" onclick="setMode('learn')">📚 Изучение</button>
  <button class="mode-btn" id="btn-quiz" onclick="setMode('quiz')">🎯 Тренировка</button>
  <button class="mode-btn" id="btn-round" onclick="setMode('round')">📋 Раунд</button>
</div>

<div class="controls" id="learn-controls">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search" id="search" placeholder="Поиск по названию, категории..." oninput="filterCards()">
  </div>
  <div class="cats" id="cats"></div>
</div>

<div id="learn-view">
  <div class="grid-wrap">
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">
      <div class="empty-icon">🔎</div>
      <div class="empty-text">Ничего не найдено</div>
    </div>
  </div>
</div>

<div id="round-view" style="display:none">
  <div class="quiz-wrap">
    <div class="quiz-card" id="round-main">
      <div class="round-prog-wrap">
        <div class="round-prog-bar"><div class="round-prog-fill" id="round-fill"></div></div>
        <div class="round-counter" id="round-counter">Вопрос 1 из 20</div>
      </div>
      <div class="quiz-q" id="round-q"></div>
      <div id="round-photo" style="display:none"><img id="round-photo-img" alt="Угадай элемент"></div>
      <div class="quiz-opts" id="round-opts"></div>
      <div class="quiz-result" id="round-result" style="display:none"></div>
      <button class="next-btn" id="round-next-btn" onclick="roundNext()" style="display:none">Следующий →</button>
    </div>
    <div class="results-card" id="round-results" style="display:none">
      <div class="res-title" id="results-title">Раунд завершён</div>
      <div class="res-score" id="results-score"></div>
      <div id="results-errors"></div>
      <div id="results-changes"></div>
      <div class="res-actions">
        <button class="next-btn" onclick="startRound()">Следующий раунд →</button>
        <button id="final-test-btn" class="next-btn final-btn" onclick="startFinalTest()" style="display:none">🏆 Финальный тест</button>
        <button class="mode-btn" onclick="setMode('learn')" style="margin-top:8px;width:100%">← К карточкам</button>
      </div>
    </div>
  </div>
</div>

<div id="quiz-view" style="display:none">
  <div class="quiz-wrap">
    <div class="quiz-card">
      <div class="quiz-score-row">
        <div class="qscore"><div class="qscore-n" style="color:var(--green)" id="qs-right">0</div><div class="qscore-l">Верно</div></div>
        <div class="qscore"><div class="qscore-n" style="color:var(--red)" id="qs-wrong">0</div><div class="qscore-l">Неверно</div></div>
        <div class="qscore"><div class="qscore-n" id="qs-total">0</div><div class="qscore-l">Всего</div></div>
      </div>
      <div class="quiz-q" id="quiz-q">Нажми «Следующий вопрос» чтобы начать</div>
      <div class="quiz-hint" id="quiz-hint"></div>
      <div id="quiz-photo" style="display:none"><img id="quiz-photo-img" alt="Угадай элемент"></div>
      <div class="quiz-opts" id="quiz-opts"></div>
      <div class="quiz-result" id="quiz-result" style="display:none"></div>
      <button class="next-btn" onclick="nextQ()">Следующий вопрос →</button>
    </div>
  </div>
</div>

const allCats = ["Все", ...new Set(elements.map(e=>e.cat))];
let activeCat = "Все";
let openCard = null;
let mode = "learn";
let qRight = 0, qWrong = 0;
let quizQueue = [], lastQuizN = null;
const LEVEL_ICONS = ['⬜','🟡','🟠','🟢'];
const LEVEL_NAMES = ['Не изучен','Знакомый','Знает','Усвоен'];
let progress = {};
function loadProgress(){ try{ progress=JSON.parse(localStorage.getItem('mb_progress')||'{}'); }catch(e){} }
function saveProgress(){ localStorage.setItem('mb_progress',JSON.stringify(progress)); }
function getP(n){ if(!progress[n]) progress[n]={level:0,streak:0}; return progress[n]; }
function updateProgress(n,correct){
  const p=getP(n);
  if(correct){ p.streak++; p.level=p.streak>=4?3:p.streak>=2?2:Math.max(p.level,1); }
  else{ p.streak=0; p.level=Math.max(0,p.level-1); }
  saveProgress();
}

function refillQueue(){
  quizQueue = [...elements].sort(() => Math.random() - 0.5);
  if(quizQueue.length > 1 && quizQueue[0].n === lastQuizN){
    const i = 1 + Math.floor(Math.random() * (quizQueue.length - 1));
    [quizQueue[0], quizQueue[i]] = [quizQueue[i], quizQueue[0]];
  }
}

function setMode(m){
  mode = m;
  document.getElementById("btn-learn").classList.toggle("active", m==="learn");
  document.getElementById("btn-quiz").classList.toggle("active", m==="quiz");
  document.getElementById("btn-round").classList.toggle("active", m==="round");
  document.getElementById("learn-controls").style.display = m==="learn"?"":"none";
  document.getElementById("learn-view").style.display = m==="learn"?"":"none";
  document.getElementById("quiz-view").style.display = m==="quiz"?"":"none";
  document.getElementById("round-view").style.display = m==="round"?"":"none";
  if(m==="quiz") nextQ();
  if(m==="round") startRound();
}

function buildCats(){
  const c = document.getElementById("cats");
  c.innerHTML = allCats.map(cat=>`
    <button class="cat-btn ${cat===activeCat?'active':''}" onclick="setCat('${cat}')">${cat}</button>
  `).join('');
}

function setCat(cat){
  activeCat = cat;
  openCard = null;
  buildCats();
  filterCards();
}

function filterCards(){
  const q = (document.getElementById("search").value||"").toLowerCase();
  const list = elements.filter(e=>
    (activeCat==="Все"||e.cat===activeCat) &&
    (!q||e.name.toLowerCase().includes(q)||e.eng.toLowerCase().includes(q)||e.cat.toLowerCase().includes(q))
  );
  document.getElementById("hs-visible").textContent = list.length;
  document.getElementById("empty").style.display = list.length ? "none" : "";
  document.getElementById("grid").innerHTML = list.map(e=>buildCard(e)).join('');
}

function buildCard(e){
  const ifStr = iface[e.n] || null;
  let ifHtml = '';
  if(ifStr){
    const [type, ...rest] = ifStr.split(':');
    const desc = rest.join(':');
    const s = ifaceStyle[type] || ifaceStyle.mixed;
    const parts = desc.split('—');
    const title = parts[0].trim();
    const detail = parts.slice(1).join('—').trim();
    ifHtml = `<div class="iface" style="background:${s.bg};border:1px solid ${s.border};color:${s.color}">
      <div class="iface-title"><span class="iface-icon">${s.icon}</span>${title}</div>
      ${detail?`<div class="iface-desc">${detail}</div>`:''}
    </div>`;
  }
  const photoHtml = photos[e.n] ? `<div class="photo-wrap"><img src="${photos[e.n]}" alt="${e.name}" loading="lazy"></div>` : '';
  return `<div class="card ${openCard===e.n?'open':''}" id="card-${e.n}" onclick="toggleCard(${e.n})">
    <div class="card-head">
      <div class="num-badge" style="background:${e.color}22;color:${e.color}">${e.n}</div>
      <div class="card-title">
        <div class="card-name">${e.name}</div>
        <div class="card-eng">${e.eng}</div>
      </div>
      <span class="cat-pill" style="background:${e.color}18;color:${e.color}">${e.cat}</span>
      <span class="prog-badge" title="${LEVEL_NAMES[getP(e.n).level]}">${LEVEL_ICONS[getP(e.n).level]}</span>
      <span class="chevron">▾</span>
    </div>
    <div class="card-body">
      <div class="card-inner">
        <div class="divider"></div>
        ${photoHtml}
        ${ifHtml}
        <div class="info-row"><div class="info-label">Функция</div><div class="info-val">${e.func}</div></div>
        <div class="info-row"><div class="info-label">Характеристики</div><div class="info-val">${e.chars}</div></div>
        ${e.tip?`<div class="tip-box"><span class="tip-label">ЗАПОМНИ</span>${e.tip}</div>`:''}
      </div>
    </div>
  </div>`;
}

function toggleCard(n){
  openCard = openCard===n ? null : n;
  filterCards();
  if(openCard){
    setTimeout(()=>{
      const el = document.getElementById("card-"+n);
      if(el) el.scrollIntoView({behavior:'smooth', block:'nearest'});
    },50);
  }
}

// QUIZ
function nextQ(){
  if(quizQueue.length === 0) refillQueue();
  const e = quizQueue.shift();
  lastQuizN = e.n;
  const types = ['func','chars','photo','photo'];
  const type = types[Math.floor(Math.random()*types.length)];

  const photoEl = document.getElementById("quiz-photo");
  const photoImg = document.getElementById("quiz-photo-img");

  if(type === 'photo'){
    photoImg.src = photos[e.n] || '';
    photoEl.style.display = '';
    document.getElementById("quiz-q").textContent = "Что изображено на фото?";
  } else {
    photoEl.style.display = 'none';
    const q = type==='func'
      ? `Какой элемент выполняет функцию?\n\n«${e.func}»`
      : `Какой элемент имеет характеристику?\n\n«${e.chars.substring(0,90)}…»`;
    document.getElementById("quiz-q").textContent = q;
  }

  document.getElementById("quiz-hint").textContent = "";
  document.getElementById("quiz-result").style.display="none";
  const others = elements.filter(x=>x.n!==e.n).sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.name);
  const opts = [e.name,...others].sort(()=>Math.random()-0.5);
  document.getElementById("quiz-opts").innerHTML = opts.map(o=>
    `<button class="qopt" onclick="answerQ('${o.replace(/'/g,"\\'")}','${e.name.replace(/'/g,"\\'")}')">${o}</button>`
  ).join('');
}

function answerQ(chosen, correct){
  const right = chosen===correct;
  if(right) qRight++; else qWrong++;
  document.getElementById("qs-right").textContent = qRight;
  document.getElementById("qs-wrong").textContent = qWrong;
  document.getElementById("qs-total").textContent = qRight+qWrong;
  document.getElementById("hs-right").textContent = qRight;
  document.querySelectorAll(".qopt").forEach(b=>{
    b.disabled=true;
    if(b.textContent===correct) b.classList.add("correct");
    else if(b.textContent===chosen && !right) b.classList.add("wrong");
  });
  const res = document.getElementById("quiz-result");
  res.style.display="";
  res.className = "quiz-result "+(right?"ok":"fail");
  res.textContent = right ? "✓ Верно!" : `✗ Неверно. Правильный ответ: ${correct}`;
}

// ROUND MODE
let roundQuestions=[],roundIdx=0,roundAnswers=[],roundCurrent=null,isFinalTest=false;

function weightedSample(arr,weights,n){
  const pool=arr.map((e,i)=>({e,w:weights[i]}));
  const out=[]; n=Math.min(n,pool.length);
  for(let i=0;i<n;i++){
    const tot=pool.reduce((s,x)=>s+x.w,0);
    let r=Math.random()*tot;
    for(let j=0;j<pool.length;j++){ r-=pool[j].w; if(r<=0){out.push(pool[j].e);pool.splice(j,1);break;} }
  }
  return out;
}

function startRound(){
  isFinalTest=false;
  const weights=elements.map(e=>[2,1.5,1,0.3][getP(e.n).level]??1);
  roundQuestions=weightedSample(elements,weights,20);
  roundIdx=0; roundAnswers=[];
  document.getElementById('round-results').style.display='none';
  document.getElementById('round-main').style.display='';
  showRoundQ();
}

function startFinalTest(){
  isFinalTest=true;
  roundQuestions=[...elements].sort(()=>Math.random()-0.5);
  roundIdx=0; roundAnswers=[];
  document.getElementById('round-results').style.display='none';
  document.getElementById('round-main').style.display='';
  showRoundQ();
}

function showRoundQ(){
  const e=roundCurrent=roundQuestions[roundIdx];
  const total=roundQuestions.length;
  document.getElementById('round-counter').textContent=(isFinalTest?'Финальный тест: ':'')+`Вопрос ${roundIdx+1} из ${total}`;
  document.getElementById('round-fill').style.width=`${roundIdx/total*100}%`;
  const types=['func','chars','photo','photo'];
  const type=types[Math.floor(Math.random()*types.length)];
  const pEl=document.getElementById('round-photo'), pImg=document.getElementById('round-photo-img');
  if(type==='photo'){ pImg.src=photos[e.n]||''; pEl.style.display=''; document.getElementById('round-q').textContent='Что изображено на фото?'; }
  else{ pEl.style.display='none'; document.getElementById('round-q').textContent=type==='func'?`Какой элемент выполняет функцию?\n\n«${e.func}»`:`Какой элемент имеет характеристику?\n\n«${e.chars.substring(0,90)}…»`; }
  document.getElementById('round-result').style.display='none';
  document.getElementById('round-next-btn').style.display='none';
  const others=elements.filter(x=>x.n!==e.n).sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.name);
  document.getElementById('round-opts').innerHTML=[e.name,...others].sort(()=>Math.random()-0.5).map(o=>
    `<button class="qopt" onclick="roundAnswer('${o.replace(/'/g,"\\'")}','${e.name.replace(/'/g,"\\'")}')">${o}</button>`
  ).join('');
}

function roundAnswer(chosen,correct){
  const e=roundCurrent, right=chosen===correct;
  const prev=getP(e.n).level;
  updateProgress(e.n,right);
  roundAnswers.push({n:e.n,name:e.name,correct:right,prev,next:getP(e.n).level});
  document.querySelectorAll('#round-opts .qopt').forEach(b=>{
    b.disabled=true;
    if(b.textContent===correct) b.classList.add('correct');
    else if(b.textContent===chosen&&!right) b.classList.add('wrong');
  });
  const res=document.getElementById('round-result');
  res.style.display=''; res.className='quiz-result '+(right?'ok':'fail');
  res.textContent=right?'✓ Верно!':`✗ Неверно. Правильный ответ: ${correct}`;
  const nb=document.getElementById('round-next-btn');
  nb.style.display='';
  nb.textContent=roundIdx+1<roundQuestions.length?'Следующий →':'Завершить →';
  filterCards();
}

function roundNext(){
  roundIdx++;
  if(roundIdx>=roundQuestions.length) showRoundResults();
  else showRoundQ();
}

function showRoundResults(){
  document.getElementById('round-main').style.display='none';
  document.getElementById('round-results').style.display='';
  const ok=roundAnswers.filter(a=>a.correct).length;
  const wrong=roundAnswers.filter(a=>!a.correct);
  document.getElementById('results-score').innerHTML=`<span style="color:var(--green)">${ok}</span> / ${roundAnswers.length}`;
  document.getElementById('results-errors').innerHTML=wrong.length===0
    ?'<div class="res-perfect">🎉 Без ошибок!</div>'
    :'<div class="res-section">Ошибки</div>'+wrong.map(a=>`<div class="res-row res-err">${LEVEL_ICONS[a.next]} ${a.name}</div>`).join('');
  const changed=roundAnswers.filter(a=>a.prev!==a.next);
  document.getElementById('results-changes').innerHTML=changed.length===0?''
    :'<div class="res-section">Прогресс</div>'+changed.map(a=>`<div class="res-row">${a.name}: ${LEVEL_ICONS[a.prev]} → ${LEVEL_ICONS[a.next]}</div>`).join('');
  document.getElementById('results-title').textContent=isFinalTest
    ?(ok===roundAnswers.length?'🏆 Идеальный результат!':'Финальный тест завершён')
    :'Раунд завершён';
  document.getElementById('final-test-btn').style.display=elements.every(e=>getP(e.n).level>=2)?'':'none';
}

function rrect(ctx,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.arc(x+w-r,y+r,r,-Math.PI/2,0);
  ctx.lineTo(x+w,y+h-r);
  ctx.arc(x+w-r,y+h-r,r,0,Math.PI/2);
  ctx.lineTo(x+r,y+h);
  ctx.arc(x+r,y+h-r,r,Math.PI/2,Math.PI);
  ctx.lineTo(x,y+r);
  ctx.arc(x+r,y+r,r,Math.PI,3*Math.PI/2);
  ctx.closePath();
}

function startGame(){
  if(_gs){ cancelAnimationFrame(_gs.raf); _gs.cleanup(); }
  const overlay=document.getElementById('game-overlay');
  const canvas=document.getElementById('game-canvas');
  const W=canvas.width=overlay.clientWidth||window.innerWidth;
  const H=canvas.height=overlay.clientHeight||window.innerHeight;
  const ctx=canvas.getContext('2d');

  const gameImgs=[];
  for(let i=1;i<=elements.length;i++){
    const img=new Image(); img.src=photos[i]||`img/${i}.jpg`; gameImgs.push(img);
  }
  const shevchukImg=new Image(); shevchukImg.src='game_assets/img/shevchuk.jpg';

  const stars=Array.from({length:80},()=>({
    x:Math.random()*W, y:Math.random()*H,
    r:Math.random()*1.4+0.3, a:Math.random()*0.6+0.2,
    t:Math.random()*Math.PI*2
  }));

  const SW=42,SH=42;
  const ship={x:W/2,y:H-80,tx:W/2};
  let bullets=[],enemies=[],parts=[];
  let score=0,dead=false,frame=0,lastShot=-99,canRestart=false;
  let boss=null,bossBullets=[],bossAnnounce=0,nextBossScore=100;
  const keys={};
  let touchX=null;

  const onKD=e=>{keys[e.key]=true; if(e.key===' ')e.preventDefault();};
  const onKU=e=>{keys[e.key]=false;};
  document.addEventListener('keydown',onKD);
  document.addEventListener('keyup',onKU);

  const onTM=e=>{e.preventDefault(); ship.tx=e.touches[0].clientX;};
  const onTS=e=>{e.preventDefault(); ship.tx=e.touches[0].clientX;};
  canvas.addEventListener('touchmove',onTM,{passive:false});
  canvas.addEventListener('touchstart',onTS,{passive:false});
  const onMM=e=>{const r=canvas.getBoundingClientRect(); ship.tx=(e.clientX-r.left)*(W/r.width);};
  canvas.addEventListener('mousemove',onMM);

  function spawnEnemy(){
    const idx=Math.floor(Math.random()*gameImgs.length);
    const sz=50+Math.random()*22;
    const spd=1.4+Math.floor(score/8)*0.3+Math.random()*0.7;
    enemies.push({x:sz/2+Math.random()*(W-sz),y:-sz/2,sz,img:gameImgs[idx],
      spd,ang:Math.random()*Math.PI*2,rot:(Math.random()-.5)*0.045});
  }

  function burst(x,y){
    const cols=['#7c6fe0','#fbbf24','#f87171','#34d399','#60a5fa'];
    for(let i=0;i<10;i++){
      const a=Math.random()*Math.PI*2, s=1.5+Math.random()*3.5;
      parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
        life:1,r:2+Math.random()*3,c:cols[Math.floor(Math.random()*cols.length)]});
    }
  }

  function drawShevchuk(b){
    const iw=90,ih=110;
    if(b.hitFlash>0) ctx.globalAlpha=0.3+0.7*((10-b.hitFlash)/10);
    // Photo clipped to rounded rect
    ctx.save();
    ctx.translate(b.x,b.y);
    rrect(ctx,-iw/2,-ih/2,iw,ih,14); ctx.clip();
    if(shevchukImg.complete&&shevchukImg.naturalWidth>0)
      ctx.drawImage(shevchukImg,-iw/2,-ih/2,iw,ih);
    else{ ctx.fillStyle='#22222f'; ctx.fill(); }
    ctx.restore();
    // Glowing border
    ctx.save();
    ctx.translate(b.x,b.y);
    rrect(ctx,-iw/2,-ih/2,iw,ih,14);
    ctx.shadowColor='#f87171'; ctx.shadowBlur=18;
    ctx.strokeStyle='#f87171'; ctx.lineWidth=3; ctx.stroke();
    ctx.restore();
    ctx.globalAlpha=1; ctx.shadowBlur=0;
    // HP bar
    const bw=140,bh=9,bx=b.x-70,by=b.y-ih/2-22;
    ctx.fillStyle='rgba(10,10,15,0.75)'; rrect(ctx,bx-2,by-2,bw+4,bh+4,5); ctx.fill();
    const pct=b.hp/b.maxHp;
    ctx.fillStyle=pct>0.5?'#34d399':pct>0.25?'#fbbf24':'#f87171';
    rrect(ctx,bx,by,bw*pct,bh,4); ctx.fill();
    ctx.fillStyle='rgba(240,240,248,0.9)';
    ctx.font="bold 11px 'JetBrains Mono',monospace"; ctx.textAlign='center';
    ctx.fillText(`ШЕВЧУК  ${b.hp}/${b.maxHp}`,b.x,by-5);
  }

  function drawShip(x,y){
    ctx.save(); ctx.translate(x,y);
    if(frame%6<3){
      ctx.beginPath();
      ctx.moveTo(-SW*.18,SH*.28); ctx.lineTo(0,SH*.28+9+Math.random()*7); ctx.lineTo(SW*.18,SH*.28);
      ctx.fillStyle='#f97316'; ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-SW*.1,SH*.28); ctx.lineTo(0,SH*.28+5+Math.random()*4); ctx.lineTo(SW*.1,SH*.28);
      ctx.fillStyle='#fbbf24'; ctx.fill();
    }
    ctx.beginPath();
    ctx.moveTo(0,-SH*.5); ctx.lineTo(SW*.5,SH*.3);
    ctx.lineTo(SW*.2,SH*.14); ctx.lineTo(-SW*.2,SH*.14); ctx.lineTo(-SW*.5,SH*.3);
    ctx.closePath(); ctx.fillStyle='#7c6fe0'; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0,-SH*.5); ctx.lineTo(SW*.14,0); ctx.lineTo(0,SH*.06); ctx.lineTo(-SW*.14,0);
    ctx.closePath(); ctx.fillStyle='#a598f5'; ctx.fill();
    ctx.beginPath(); ctx.arc(0,-SH*.14,5.5,0,Math.PI*2);
    ctx.fillStyle='#60a5fa'; ctx.fill();
    ctx.restore();
  }

  function loop(){
    frame++;
    if(!dead){
      if(keys['ArrowLeft']||keys['a']) ship.tx-=14;
      if(keys['ArrowRight']||keys['d']) ship.tx+=14;
      ship.tx=Math.max(SW/2,Math.min(W-SW/2,ship.tx));
      ship.x+=(ship.tx-ship.x)*0.16;

      if(frame-lastShot>=18){
        bullets.push({x:ship.x,y:ship.y-SH*.5});
        lastShot=frame;
      }

      bullets.forEach(b=>b.y-=13);
      bullets=bullets.filter(b=>b.y>-14);

      const spEvery=Math.max(36,82-Math.floor(score/5)*6);
      if(frame%spEvery===0) spawnEnemy();

      enemies.forEach(e=>{e.y+=e.spd; e.ang+=e.rot;});

      for(let bi=bullets.length-1;bi>=0;bi--){
        for(let ei=enemies.length-1;ei>=0;ei--){
          const b=bullets[bi],e=enemies[ei];
          if(b&&e&&Math.abs(b.x-e.x)<e.sz*.52&&Math.abs(b.y-e.y)<e.sz*.52){
            burst(e.x,e.y); bullets.splice(bi,1); enemies.splice(ei,1); score++; break;
          }
        }
      }
      for(const e of enemies){
        if(Math.abs(e.x-ship.x)<e.sz*.42+SW*.32&&Math.abs(e.y-ship.y)<e.sz*.42+SH*.32){
          dead=true; burst(ship.x,ship.y); burst(ship.x,ship.y); break;
        }
      }
      enemies=enemies.filter(e=>e.y<H+e.sz);
      parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life-=0.038;});
      parts=parts.filter(p=>p.life>0);

      // Boss spawn
      if(score>=nextBossScore&&!boss){
        boss={x:W/2,y:-80,hp:30,maxHp:30,vx:2.2,phase:'enter',
              shootTimer:0,shootEvery:110,ang:0,hitFlash:0};
        bossAnnounce=200; enemies=[];
      }
      // Boss update
      if(boss){
        if(boss.hitFlash>0) boss.hitFlash--;
        if(boss.phase==='enter'){
          boss.y+=2.2;
          if(boss.y>=90) boss.phase='fight';
        } else if(boss.phase==='fight'){
          boss.x+=boss.vx;
          if(boss.x>W-55||boss.x<55) boss.vx*=-1;
          boss.shootTimer++;
          if(boss.shootTimer>=boss.shootEvery){
            boss.shootTimer=0;
            const dx=ship.x-boss.x,dy=ship.y-boss.y,dist=Math.hypot(dx,dy);
            bossBullets.push({x:boss.x,y:boss.y+22,vx:dx/dist*4.5,vy:dy/dist*4.5});
          }
          // Player bullets → boss
          for(let bi=bullets.length-1;bi>=0;bi--){
            const b=bullets[bi];
            if(Math.abs(b.x-boss.x)<40&&Math.abs(b.y-(boss.y-10))<60){
              bullets.splice(bi,1); boss.hp--; boss.hitFlash=10;
              if(boss.hp<=0){
                boss.phase='dead'; bossBullets=[];
                for(let i=0;i<5;i++) burst(boss.x+(Math.random()-.5)*60,boss.y+(Math.random()-.5)*50);
                score+=30; nextBossScore+=100;
                setTimeout(()=>{boss=null;},1800);
              }
              break;
            }
          }
          // Boss body → ship
          if(Math.abs(boss.x-ship.x)<42+SW*.35&&Math.abs(boss.y-ship.y)<60+SH*.35){
            dead=true; burst(ship.x,ship.y); burst(ship.x,ship.y);
          }
        }
        boss.ang+=0.08;
        bossBullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;});
        bossBullets=bossBullets.filter(b=>b.y<H+20&&b.x>-20&&b.x<W+20);
        // Boss bullet → ship
        for(const b of bossBullets){
          if(Math.abs(b.x-ship.x)<SW*.45&&Math.abs(b.y-ship.y)<SH*.45){
            dead=true; burst(ship.x,ship.y); burst(ship.x,ship.y); break;
          }
        }
      }
      if(bossAnnounce>0) bossAnnounce--;
    }

    // draw
    ctx.fillStyle='#0a0a0f'; ctx.fillRect(0,0,W,H);
    stars.forEach(s=>{
      s.t+=0.018;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(240,240,248,${s.a*(0.65+0.35*Math.sin(s.t))})`; ctx.fill();
    });

    bullets.forEach(b=>{
      const g=ctx.createLinearGradient(b.x,b.y-14,b.x,b.y+4);
      g.addColorStop(0,'#c4b5fd'); g.addColorStop(1,'transparent');
      ctx.fillStyle=g; ctx.fillRect(b.x-2,b.y-14,4,18);
      ctx.beginPath(); ctx.arc(b.x,b.y-14,3,0,Math.PI*2);
      ctx.fillStyle='#7c6fe0'; ctx.fill();
    });

    enemies.forEach(e=>{
      ctx.save(); ctx.translate(e.x,e.y); ctx.rotate(e.ang);
      rrect(ctx,-e.sz/2,-e.sz/2,e.sz,e.sz,10); ctx.clip();
      if(e.img.complete&&e.img.naturalWidth>0) ctx.drawImage(e.img,-e.sz/2,-e.sz/2,e.sz,e.sz);
      else{ctx.fillStyle='#22222f'; ctx.fill();}
      ctx.restore();
      ctx.save(); ctx.translate(e.x,e.y); ctx.rotate(e.ang);
      rrect(ctx,-e.sz/2,-e.sz/2,e.sz,e.sz,10);
      ctx.strokeStyle='rgba(124,111,224,0.75)'; ctx.lineWidth=2; ctx.stroke();
      ctx.restore();
    });

    // Boss bullets
    bossBullets.forEach(b=>{
      const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,9);
      g.addColorStop(0,'#fff'); g.addColorStop(0.3,'#fbbf24');
      g.addColorStop(0.7,'#f97316'); g.addColorStop(1,'transparent');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(b.x,b.y,9,0,Math.PI*2); ctx.fill();
    });
    // Boss
    if(boss&&boss.phase!=='dead') drawShevchuk(boss);

    parts.forEach(p=>{
      ctx.globalAlpha=Math.max(0,p.life);
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.c; ctx.fill();
    });
    ctx.globalAlpha=1;

    if(!dead) drawShip(ship.x,ship.y);

    ctx.fillStyle='rgba(240,240,248,.85)';
    ctx.font="600 15px 'JetBrains Mono',monospace";
    ctx.textAlign='left';
    ctx.fillText(`Сбито: ${score}`,16,36);

    if(bossAnnounce>0){
      ctx.save();
      ctx.globalAlpha=Math.min(1,bossAnnounce<30?bossAnnounce/30:1);
      ctx.textAlign='center';
      ctx.font="700 26px 'Inter',sans-serif"; ctx.fillStyle='#f87171';
      ctx.fillText('⚠  БОСС ПОЯВИЛСЯ  ⚠',W/2,H/2-20);
      ctx.font="700 46px 'JetBrains Mono',monospace"; ctx.fillStyle='#fbbf24';
      ctx.fillText('ШЕВЧУК',W/2,H/2+36);
      ctx.restore();
    }

    if(frame<150&&!dead){
      ctx.fillStyle='rgba(152,152,176,.65)';
      ctx.font="13px 'Inter',sans-serif";
      ctx.textAlign='center';
      ctx.fillText('Двигай мышью / пальцем',W/2,H-20);
    }

    if(dead&&parts.length===0){
      canRestart=true;
      ctx.fillStyle='rgba(10,10,15,.84)'; ctx.fillRect(0,0,W,H);
      ctx.textAlign='center';
      ctx.font="700 38px 'Inter',sans-serif"; ctx.fillStyle='#f87171';
      ctx.fillText('GAME OVER',W/2,H/2-52);
      ctx.font="500 16px 'Inter',sans-serif"; ctx.fillStyle='#9898b0';
      ctx.fillText('Сбито компонентов',W/2,H/2-10);
      ctx.font="700 56px 'JetBrains Mono',monospace"; ctx.fillStyle='#f0f0f8';
      ctx.fillText(score,W/2,H/2+54);
      const bx=W/2-90,by=H/2+78;
      rrect(ctx,bx,by,180,48,12); ctx.fillStyle='#7c6fe0'; ctx.fill();
      ctx.font="600 15px 'Inter',sans-serif"; ctx.fillStyle='#fff';
      ctx.fillText('Играть снова',W/2,by+31);
    }

    _gs.raf=requestAnimationFrame(loop);
  }

  function handleRestart(cx,cy){
    if(!dead||!canRestart) return;
    const bx=W/2-90,by=H/2+78;
    if(cx>bx&&cx<bx+180&&cy>by&&cy<by+48) startGame();
  }
  canvas.onclick=e=>{
    const r=canvas.getBoundingClientRect();
    handleRestart((e.clientX-r.left)*(W/r.width),(e.clientY-r.top)*(H/r.height));
  };
  canvas.addEventListener('touchend',e=>{
    const r=canvas.getBoundingClientRect(),t=e.changedTouches[0];
    handleRestart((t.clientX-r.left)*(W/r.width),(t.clientY-r.top)*(H/r.height));
  });

  _gs={
    raf:requestAnimationFrame(loop),
    cleanup(){
      document.removeEventListener('keydown',onKD);
      document.removeEventListener('keyup',onKU);
      canvas.removeEventListener('touchmove',onTM);
      canvas.removeEventListener('touchstart',onTS);
      canvas.removeEventListener('mousemove',onMM);
    }
  };
}
</script>

<button id="game-btn" title="Мини-игра" onclick="openGame()">🚀</button>

<div id="game-overlay" style="display:none">
  <canvas id="game-canvas"></canvas>
  <button id="game-close" onclick="closeGame()">✕</button>
</div>

</body>
</html>
