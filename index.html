const allCats = ["Все", ...new Set(elements.map(e=>e.cat))];
let activeCat = "Все";
let openCard = null;
let mode = "learn";
let qRight = 0, qWrong = 0;

function setMode(m){
  mode = m;
  document.getElementById("btn-learn").classList.toggle("active", m==="learn");
  document.getElementById("btn-quiz").classList.toggle("active", m==="quiz");
  document.getElementById("learn-controls").style.display = m==="learn"?"":"none";
  document.getElementById("learn-view").style.display = m==="learn"?"":"none";
  document.getElementById("quiz-view").style.display = m==="quiz"?"":"none";
  if(m==="quiz") nextQ();
}

function buildCats(){
  const c = document.getElementById("cats");
  c.innerHTML = allCats.map(cat=>`
    <button class="cat-btn ${cat===activeCat?'active':''}" onclick="setCat('${cat}')">${cat}</button>
  `).join('');
}

function setCat(cat){
  activeCat = cat;
  openCard = null;
  buildCats();
  filterCards();
}

function filterCards(){
  const q = (document.getElementById("search").value||"").toLowerCase();
  const list = elements.filter(e=>
    (activeCat==="Все"||e.cat===activeCat) &&
    (!q||e.name.toLowerCase().includes(q)||e.eng.toLowerCase().includes(q)||e.cat.toLowerCase().includes(q))
  );
  document.getElementById("hs-visible").textContent = list.length;
  document.getElementById("empty").style.display = list.length ? "none" : "";
  document.getElementById("grid").innerHTML = list.map(e=>buildCard(e)).join('');
}

function buildCard(e){
  const ifStr = iface[e.n] || null;
  let ifHtml = '';
  if(ifStr){
    const [type, ...rest] = ifStr.split(':');
    const desc = rest.join(':');
    const s = ifaceStyle[type] || ifaceStyle.mixed;
    const parts = desc.split('—');
    const title = parts[0].trim();
    const detail = parts.slice(1).join('—').trim();
    ifHtml = `<div class="iface" style="background:${s.bg};border:1px solid ${s.border};color:${s.color}">
      <div class="iface-title"><span class="iface-icon">${s.icon}</span>${title}</div>
      ${detail?`<div class="iface-desc">${detail}</div>`:''}
    </div>`;
  }
  const photoHtml = photos[e.n] ? `<div class="photo-wrap"><img src="${photos[e.n]}" alt="${e.name}" loading="lazy"></div>` : '';
  return `<div class="card ${openCard===e.n?'open':''}" id="card-${e.n}" onclick="toggleCard(${e.n})">
    <div class="card-head">
      <div class="num-badge" style="background:${e.color}22;color:${e.color}">${e.n}</div>
      <div class="card-title">
        <div class="card-name">${e.name}</div>
        <div class="card-eng">${e.eng}</div>
      </div>
      <span class="cat-pill" style="background:${e.color}18;color:${e.color}">${e.cat}</span>
      <span class="chevron">▾</span>
    </div>
    <div class="card-body">
      <div class="card-inner">
        <div class="divider"></div>
        ${photoHtml}
        ${ifHtml}
        <div class="info-row"><div class="info-label">Функция</div><div class="info-val">${e.func}</div></div>
        <div class="info-row"><div class="info-label">Характеристики</div><div class="info-val">${e.chars}</div></div>
        ${e.tip?`<div class="tip-box"><span class="tip-label">ЗАПОМНИ</span>${e.tip}</div>`:''}
      </div>
    </div>
  </div>`;
}

function toggleCard(n){
  openCard = openCard===n ? null : n;
  filterCards();
  if(openCard){
    setTimeout(()=>{
      const el = document.getElementById("card-"+n);
      if(el) el.scrollIntoView({behavior:'smooth', block:'nearest'});
    },50);
  }
}

// QUIZ
function nextQ(){
  const e = elements[Math.floor(Math.random()*elements.length)];
  const types = ['func','chars','photo','photo'];
  const type = types[Math.floor(Math.random()*types.length)];

  const photoEl = document.getElementById("quiz-photo");
  const photoImg = document.getElementById("quiz-photo-img");

  if(type === 'photo'){
    photoImg.src = photos[e.n] || '';
    photoEl.style.display = '';
    document.getElementById("quiz-q").textContent = "Что изображено на фото?";
  } else {
    photoEl.style.display = 'none';
    const q = type==='func'
      ? `Какой элемент выполняет функцию?\n\n«${e.func}»`
      : `Какой элемент имеет характеристику?\n\n«${e.chars.substring(0,90)}…»`;
    document.getElementById("quiz-q").textContent = q;
  }

  document.getElementById("quiz-hint").textContent = "";
  document.getElementById("quiz-result").style.display="none";
  const others = elements.filter(x=>x.n!==e.n).sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.name);
  const opts = [e.name,...others].sort(()=>Math.random()-0.5);
  document.getElementById("quiz-opts").innerHTML = opts.map(o=>
    `<button class="qopt" onclick="answerQ('${o.replace(/'/g,"\\'")}','${e.name.replace(/'/g,"\\'")}')">${o}</button>`
  ).join('');
}

function answerQ(chosen, correct){
  const right = chosen===correct;
  if(right) qRight++; else qWrong++;
  document.getElementById("qs-right").textContent = qRight;
  document.getElementById("qs-wrong").textContent = qWrong;
  document.getElementById("qs-total").textContent = qRight+qWrong;
  document.getElementById("hs-right").textContent = qRight;
  document.querySelectorAll(".qopt").forEach(b=>{
    b.disabled=true;
    if(b.textContent===correct) b.classList.add("correct");
    else if(b.textContent===chosen && !right) b.classList.add("wrong");
  });
  const res = document.getElementById("quiz-result");
  res.style.display="";
  res.className = "quiz-result "+(right?"ok":"fail");
  res.textContent = right ? "✓ Верно!" : `✗ Неверно. Правильный ответ: ${correct}`;
}

// INIT
document.getElementById("hs-total").textContent = elements.length;
buildCats();
filterCards();
</script>
